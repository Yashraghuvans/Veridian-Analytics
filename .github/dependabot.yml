# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      next-js:
        patterns:
          - next
          - eslint-config-next
      remotion:
        patterns:
          - remotion
          - "@remotion/*"
      react:
        patterns:
          - react
          - react-dom
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"

  - package-ecosystem: npm
    directory: /.deps
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      remotion-vendor:
        patterns:
          - remotion
          - "@remotion/*"
